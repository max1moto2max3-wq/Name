name: Native Android validation

on:
  push:
    branches: [main, native-android-redesign, lamah-native-editor]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build standalone debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build standalone release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK builds
        uses: actions/upload-artifact@v4
        with:
          name: Lamah-native-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
