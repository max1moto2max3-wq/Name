name: Android and editor validation

on:
  push:
    branches: [main, android-studio-app]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check embedded editor JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\\S]*?)<\/script>/gi)];
          if (scripts.length === 0) throw new Error('No inline editor script found');
          scripts.forEach((match, index) => {
            new Function(match[1]);
            console.log('Inline script ' + (index + 1) + ': syntax OK');
          });
          NODE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
